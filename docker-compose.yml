
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/check_databases.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./check_databases.sh:/usr/local/bin/check_databases.sh:ro
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  importer:
    build: ./importer
    container_name: importer
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: pg
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
    volumes:
      - ./data:/data
      - ./importer:/importer
      - ./products:/products
      - ./mapserver/mapfiles:/etc/mapserver

  mapserver:
    build: ./mapserver
    container_name: mapserver
    depends_on:
      - db
      - importer
    ports:
      - "8081:80"
    volumes:
      - ./mapserver/mapfiles:/etc/mapserver

volumes:
  db_data:
